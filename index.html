<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contagem de raspadinhas</title>
<meta name="theme-color" content="#1f5f4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Raspadinhas">
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#1d2421; --muted:#68726d; --line:#dcd6c8;
  --brand:#1f5f4a; --brand-ink:#ffffff; --accent:#d98e04; --warn:#b3261e; --ok:#1f7a4d; --field:#f8f6f0; --campo:#ffffff; --campo-borda:#9aa39e;
  --p1:#2a7ab0; --p2:#7a4fb0; --p3:#b05a2a; --p5:#1f7a4d; --p10:#a02a5a; --p15:#444;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141816; --card:#1e2421; --ink:#eceee9; --muted:#9aa5a0; --line:#323b37;
    --brand:#3b9b79; --brand-ink:#08130f; --accent:#f0a820; --warn:#ff8a80; --ok:#5ed39b; --field:#171c19; --campo:#ffffff; --campo-borda:#9aa39e;
    --p1:#6db3e6; --p2:#b99be6; --p3:#e6a06d; --p5:#5ed39b; --p10:#e68ab3; --p15:#bbb;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(84px + env(safe-area-inset-bottom));}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:10px 16px 12px;
  padding-top:calc(10px + env(safe-area-inset-top))}
header h1{font-size:1.05rem;margin:0 0 8px;font-weight:650;display:flex;align-items:center;justify-content:space-between;gap:8px}
#tipo-lbl{min-height:32px;border-radius:16px;border:2px solid rgba(255,255,255,.7);background:transparent;color:var(--brand-ink);
  font:inherit;font-size:.9rem;font-weight:600;padding:0 12px}
.controlos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.controlos select,.controlos input{width:100%;min-height:44px;border-radius:10px;border:0;padding:0 10px;font:inherit;
  background:rgba(255,255,255,.95);color:#1d2421}
#ecra{min-height:44px;border-radius:10px;border:2px solid rgba(255,255,255,.55);background:transparent;
  color:var(--brand-ink);font:inherit;font-weight:600;padding:0 8px}
#ecra[aria-pressed="true"]{background:#fff;color:#1f5f4a;border-color:#fff}
.barra{display:flex;gap:8px;padding:10px 16px 4px;align-items:center}
.barra input[type=search]{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);padding:0 12px;font:inherit;
  background:var(--card);color:var(--ink)}
.chip{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px;font:inherit}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
main{padding:6px 16px}
.cab,.linha{display:grid;grid-template-columns:minmax(0,1fr) 58px 58px 46px;gap:5px;align-items:center}
.cab{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:6px 12px 2px}
.cab span:not(:first-child){text-align:center}
.linha{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 8px;margin:6px 0}
.linha.tem{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.nome{min-width:0}
.nome b{font-size:1.06rem}
.nome .n{color:var(--ink);overflow-wrap:anywhere}
.nome .pv{display:table;font-size:.72rem;font-weight:700;border-radius:6px;padding:1px 6px;margin-top:2px;
  color:#fff}
.pv.p1{background:var(--p1)}.pv.p2{background:var(--p2)}.pv.p3{background:var(--p3)}.pv.p5{background:var(--p5)}
.pv.p10{background:var(--p10)}.pv.p15{background:var(--p15)}
.linha input{width:100%;min-height:48px;border-radius:10px;border:2px solid var(--campo-borda);background:var(--campo);color:#000;
  font:inherit;font-size:1.1rem;text-align:center;padding:0 2px}
.linha input:focus{outline:3px solid var(--accent);outline-offset:0;background:#fff}
.tot{text-align:center;font-weight:700;font-size:1.05rem}
.tot small{display:block;font-weight:400;color:var(--muted);font-size:.6rem}
.resumo{margin:14px 0 4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.resumo h2{font-size:.95rem;margin:0 0 6px}
.resumo table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.resumo th{font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:500;text-align:right;padding:2px 0}
.resumo th:first-child,.resumo td:first-child{text-align:left}
.resumo td{text-align:right;padding:5px 0;border-top:1px solid var(--line)}
.resumo tr.soma td{font-weight:750;border-top:2px solid var(--ink)}
.vazio{color:var(--muted);text-align:center;padding:28px 0}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 16px 16px}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;padding:0 12px}
.btn.principal{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.perigo{color:var(--warn)}
.btn.larga{grid-column:1/-1}
.nome .sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.nome .sub .pv{margin-top:0}
.mb{min-height:44px;border-radius:10px;border:1px dashed var(--brand);background:transparent;color:var(--brand);font:inherit;font-size:.82rem;font-weight:600;padding:0 10px}
.mb.tem-m{background:var(--brand);color:var(--brand-ink);border-style:solid}
.macos{grid-column:1/-1;border-top:1px dashed var(--line);margin-top:6px;padding-top:8px}
.maco{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:8px}
.maco .lbl{font-size:.7rem;color:var(--muted);width:100%}
.linha .maco input{width:76px;min-height:48px}
.maco .rest{font-weight:700;min-width:84px}
.maco .erro{color:var(--warn);font-size:.8rem;width:100%}
.maco .av{color:var(--accent);font-size:.8rem;width:100%}
.maco .chip,.maco .x{min-height:44px;padding:0 12px}
.macos .soma{font-size:.85rem;color:var(--muted)}
dialog{max-height:88vh;overflow:auto}
.g-item{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0}
.g-item b{display:block}
.g-item small{color:var(--muted);display:block;margin:2px 0 6px}
.g-item .bt{display:flex;gap:6px}
.g-item .btn{min-height:44px;flex:1;padding:0 6px}
.rodape{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;z-index:6}
.rodape .num{font-size:1.25rem;font-weight:750}
.rodape .sub{font-size:.8rem;color:var(--muted)}
dialog{border:0;border-radius:16px;padding:18px;max-width:92vw;width:420px;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 10px;font-size:1.1rem}
dialog label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px}
dialog input,dialog select{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);padding:0 10px;font:inherit;background:var(--field);color:var(--ink)}
dialog .fim{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.aviso{font-size:.82rem;color:var(--muted);padding:0 16px 8px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));background:#1d2421;color:#fff;border-radius:12px;
  padding:12px 14px;z-index:9;display:none}
</style>
</head>
<body>
<header>
  <h1><span>Contagem de raspadinhas</span><button id="tipo-lbl" aria-label="Tipo de contagem (tocar para trocar)"></button></h1>
  <div class="controlos">
    <select id="loja" aria-label="Loja">
      <option value="1">Loja 1 · Raimundo</option>
      <option value="2">Loja 2 · Mourão</option>
      <option value="3">Loja 3 · Carlitos</option>
      <option value="4">Loja 4 · Luanda</option>
    </select>
    <input id="data" type="date" aria-label="Data da contagem">
    <select id="func" aria-label="Funcionária"></select>
    <button id="ecra" aria-pressed="false">Ecrã sempre ligado</button>
  </div>
</header>

<div class="barra">
  <input id="pesq" type="search" placeholder="Procurar jogo ou nome" inputmode="search" aria-label="Procurar">
  <button class="chip" id="so-tem" aria-pressed="false">Só contados</button>
</div>
<div class="aviso" id="aviso-lista"></div>

<main>
  <div class="cab"><span>Jogo</span><span>Soltos</span><span>Blocos</span><span>Total</span></div>
  <div id="lista"></div>
  <section class="resumo" id="resumo" aria-label="Resumo"></section>
</main>

<div class="acoes">
  <button class="btn" id="b-novo">+ Jogo que não está na lista</button>
  <button class="btn" id="b-copiar">Copiar final de ontem</button>
  <button class="btn principal" id="b-enviar">Enviar contagem</button>
  <button class="btn perigo" id="b-limpar">Limpar tudo</button>
  <button class="btn larga" id="b-guardadas">Contagens guardadas e cópia de segurança</button>
</div>

<div class="rodape">
  <div><div class="num" id="r-total">0 bilhetes</div><div class="sub" id="r-valor">0 €</div></div>
  <div class="sub" id="r-jogos">0 jogos contados</div>
</div>
<div class="toast" id="toast" role="status"></div>

<dialog id="d-guard">
  <h2>Contagens guardadas</h2>
  <div class="aviso" id="g-copia" style="padding:0 0 8px"></div>
  <div id="g-lista"></div>
  <div class="fim" style="flex-wrap:wrap;justify-content:stretch">
    <button class="btn" id="g-backup" style="flex:1">Guardar cópia de segurança</button>
    <button class="btn" id="g-restaurar" style="flex:1">Restaurar cópia</button>
  </div>
  <div class="fim"><button class="btn principal" id="g-fechar">Fechar</button></div>
  <input type="file" id="g-ficheiro" accept=".json,application/json" hidden>
</dialog>

<dialog id="d-func">
  <h2>Novo nome de funcionária</h2>
  <label for="f-nome">Nome</label>
  <input id="f-nome" maxlength="40" autocapitalize="characters">
  <div class="fim"><button class="btn" id="f-cancel">Cancelar</button><button class="btn principal" id="f-ok">Guardar</button></div>
</dialog>

<dialog id="d-novo">
  <h2>Jogo que não está na lista</h2>
  <label for="n-jogo">Número do jogo (3 dígitos)</label>
  <input id="n-jogo" inputmode="numeric" pattern="[0-9]*" maxlength="5">
  <label for="n-nome">Nome</label>
  <input id="n-nome" maxlength="40">
  <label for="n-preco">Preço do bilhete</label>
  <select id="n-preco"><option>1</option><option>2</option><option>3</option><option>5</option><option>10</option><option>15</option><option>20</option></select>
  <div class="fim"><button class="btn" id="n-cancel">Cancelar</button><button class="btn principal" id="n-ok">Guardar</button></div>
</dialog>

<script>
"use strict";
const POR_MACO = {1:100, 2:50, 3:35, 5:35, 10:20, 15:20, 20:20};
const LOJAS = {1:"Raimundo", 2:"Mourao", 3:"Carlitos", 4:"Luanda"};
let jogos = [];            // lista do site + jogos acrescentados à mão
let estado = null;         // {loja, data, tipo, linhas:{jogo:{ind,blo}}, extras:[...]}

const FUNC_BASE = ["KINDERLI SILVA","CARLA CLAUDIO","VERA LOURO","LURDES MARQUES","TANIA SENICA","DULCE SANTOS","MARTA LOPES","SOFIA FERREIRA","ELISABETE VAZ","SANDRA RODRIGUES","DENIS CAETANO"];
const $ = id => document.getElementById(id);
const hoje = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const ler = (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e){ return def; } };
const chave = (loja, data, tipo) => `rasp:${loja}:${data}:${tipo}`;
const num = v => { const n = parseInt(v, 10); return Number.isFinite(n) && n > 0 ? n : 0; };

function toast(msg){ const t=$("toast"); t.textContent=msg; t.style.display="block"; clearTimeout(toast.h); toast.h=setTimeout(()=>t.style.display="none",3500); }

async function carregarJogos(){
  let base = [];
  try {
    const r = await fetch("jogos.json?x=" + Date.now());
    const j = await r.json();
    base = j.jogos;
    $("aviso-lista").textContent = "Lista de jogos de " + j.gerado;
  } catch(e) {
    base = ler("rasp:jogos", []);
    $("aviso-lista").textContent = base.length ? "Sem ligação: lista guardada no telemóvel." : "Sem lista de jogos: usa «+ Jogo que não está na lista».";
  }
  if (base.length) guardar("rasp:jogos", base);
  jogos = base;
}

function listaCompleta(){
  const extras = (estado.extras || []).filter(e => !jogos.some(j => j.jogo === e.jogo));
  return [...jogos, ...extras].sort((a,b) => a.preco - b.preco || a.jogo - b.jogo);
}

// funcionária: lista fixa + nomes novos guardados no telemóvel
const listaFunc = () => [...new Set([...FUNC_BASE, ...ler("rasp:funcs", [])])].sort((a,b) => a.localeCompare(b, "pt"));
function desenharFunc(sel){
  const s = $("func");
  s.innerHTML = '<option value="">Funcionária…</option>' + listaFunc().map(n => `<option>${esc(n)}</option>`).join("") + '<option value="__novo__">+ Novo nome…</option>';
  s.value = sel || "";
}
$("func").addEventListener("change", e => {
  if (e.target.value === "__novo__"){ $("f-nome").value = ""; e.target.value = estado.func || ""; $("d-func").showModal(); return; }
  estado.func = e.target.value; guardar("rasp:func", estado.func); guardarEstado();
});
$("f-cancel").addEventListener("click", () => $("d-func").close());
$("f-ok").addEventListener("click", () => {
  const n = $("f-nome").value.trim().replace(/\s+/g, " ").toUpperCase();
  if (!n) return toast("Escreve o nome.");
  guardar("rasp:funcs", [...new Set([...ler("rasp:funcs", []), n])]);
  estado.func = n; guardar("rasp:func", n); guardarEstado(); desenharFunc(n); $("d-func").close();
});

function guardarEstado(){ guardar(chave(estado.loja, estado.data, estado.tipo), estado); guardar("rasp:ultimo", {loja:estado.loja, data:estado.data, tipo:estado.tipo}); }

function abrir(loja, data, tipo){
  estado = ler(chave(loja, data, tipo), null) || {loja, data, tipo, linhas:{}, extras:[]};
  // jogos acrescentados à mão numa contagem ficam disponíveis nas seguintes da mesma loja
  const memo = ler("rasp:extras:" + loja, []);
  estado.extras = [...(estado.extras||[]), ...memo.filter(m => !(estado.extras||[]).some(e => e.jogo === m.jogo))];
  if (!estado.func) estado.func = ler("rasp:func", "");
  desenharFunc(estado.func);
  $("loja").value = loja; $("data").value = data;
  $("tipo-lbl").textContent = tipo === "final" ? "Final" : "Inicial";
  desenhar();
}

// maço aberto: escreve-se o nº onde o maço vai (o próximo a vender) e o último nº; a ordem pode ser crescente ou decrescente
const p3 = v => String(v == null ? "" : v).replace(/\D/g, "").slice(0, 3);
const pad3 = n => String(n).padStart(3, "0");
function restoMaco(m, maco){
  if (!m || m.a === "" || m.b === "" || m.a == null || m.b == null) return {n:0};
  const a = +m.a, b = +m.b;
  if (maco && (a > maco - 1 || b > maco - 1)) return {n:0, erro:`Número fora do maço (000 a ${pad3(maco - 1)}).`};
  const r = {n: Math.abs(b - a) + 1};
  if (maco && b !== 0 && b !== maco - 1) r.aviso = `O último de um maço é 000 ou ${pad3(maco - 1)}. Confirma.`;
  return r;
}
const restoMacos = (l, maco) => ((l && l.macos) || []).reduce((s, m) => s + restoMaco(m, maco).n, 0);
const temContagem = l => !!(l && (num(l.ind) || num(l.blo) || (l.macos || []).some(m => m.a !== "" && m.b !== "")));
const macoDe = j => j.por_maco || POR_MACO[j.preco] || 0;
const abertos = new Set();   // linhas com o painel «maço aberto» aberto
function totalLinha(j){
  const l = estado.linhas[j.jogo] || {}, maco = macoDe(j);
  return num(l.ind) + restoMacos(l, maco) + num(l.blo) * maco;
}
function htmlMacos(j, l){
  const maco = macoDe(j), ms = l.macos || [];
  let h = '<div class="macos">';
  ms.forEach((m, i) => {
    const r = restoMaco(m, maco);
    h += `<div class="maco" data-i="${i}"><span class="lbl">Maço ${i + 1}: número onde vai → último número</span>` +
      `<input inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="agora" aria-label="Número onde o maço vai" data-m="a" value="${esc(m.a || "")}">` +
      `<span>→</span>` +
      `<input inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="último" aria-label="Último número do maço" data-m="b" value="${esc(m.b || "")}">` +
      (maco ? `<button class="chip" data-a="fim" data-v="0">000</button><button class="chip" data-a="fim" data-v="${maco - 1}">${pad3(maco - 1)}</button>` : "") +
      `<span class="rest">${r.n ? "= " + r.n + " bilhetes" : ""}</span>` +
      `<button class="chip x" data-a="rm" aria-label="Remover maço">✕</button>` +
      `<span class="erro">${esc(r.erro || "")}</span><span class="av">${esc(r.aviso || "")}</span></div>`;
  });
  h += `<button class="chip" data-a="add">+ ${ms.length ? "outro maço" : "maço aberto"}</button>`;
  if (ms.length > 1) h += ` <span class="soma">Maços abertos: ${restoMacos(l, maco)} bilhetes</span>`;
  return h + "</div>";
}
const rotuloMb = (l, maco) => ((l.macos || []).some(m => restoMaco(m, maco).erro) ? "⚠ " : "") + "Maço aberto" + ((l.macos || []).length ? ": " + restoMacos(l, maco) : "");
function criarLinha(j){
  const l = estado.linhas[j.jogo] || {}, maco = macoDe(j), tem = temContagem(l);
  const nm = (l.macos || []).length;
  const d = document.createElement("div");
  d.className = "linha" + (tem ? " tem" : ""); d.dataset.jogo = j.jogo;
  d.innerHTML =
    `<div class="nome"><b>${j.jogo}</b> <span class="n">${esc(j.nome)}</span><div class="sub"><span class="pv p${j.preco}">${j.preco} €</span>` +
    `<button class="mb${nm ? " tem-m" : ""}" data-a="tog">${rotuloMb(l, maco)}</button></div></div>` +
    `<input inputmode="numeric" pattern="[0-9]*" aria-label="Soltos ${j.jogo}" data-c="ind" value="${num(l.ind)||""}">` +
    `<input inputmode="numeric" pattern="[0-9]*" aria-label="Blocos ${j.jogo}" data-c="blo" value="${num(l.blo)||""}">` +
    `<div class="tot">${totalLinha(j)||""}<small>${maco ? "×"+maco : ""}</small></div>` +
    (abertos.has(j.jogo) ? htmlMacos(j, l) : "");
  return d;
}
function redesenharLinha(jogo){
  const j = listaCompleta().find(x => x.jogo === jogo), old = $("lista").querySelector(`.linha[data-jogo="${jogo}"]`);
  if (j && old) old.replaceWith(criarLinha(j));
  guardarEstado(); totais();
}

function desenhar(){
  const q = $("pesq").value.trim().toLowerCase();
  const soTem = $("so-tem").getAttribute("aria-pressed") === "true";
  const box = $("lista"); box.innerHTML = "";
  let n = 0;
  for (const j of listaCompleta()){
    const l = estado.linhas[j.jogo] || {};
    if (soTem && !temContagem(l)) continue;
    if (q && !(String(j.jogo).includes(q) || j.nome.toLowerCase().includes(q))) continue;
    n++;
    box.appendChild(criarLinha(j));
  }
  if (!n) box.innerHTML = '<div class="vazio">Nenhum jogo para mostrar.</div>';
  totais();
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function totais(){
  let bil = 0, eur = 0, jg = 0;
  for (const j of listaCompleta()){ const t = totalLinha(j); if (t){ bil += t; eur += t * j.preco; jg++; } }
  const pp = {};
  for (const j of listaCompleta()){ const t = totalLinha(j); if (t){ const o = pp[j.preco] = pp[j.preco] || {b:0}; o.b += t; } }
  const f = n => n.toLocaleString("pt-PT");
  $("resumo").innerHTML = "<h2>Resumo da contagem</h2><table><tr><th>Valor</th><th>Bilhetes</th><th>Euros</th></tr>" +
    Object.keys(pp).map(Number).sort((a,b) => a-b).map(p => `<tr><td>${p} €</td><td>${f(pp[p].b)}</td><td>${f(pp[p].b*p)} €</td></tr>`).join("") +
    `<tr class="soma"><td>Total</td><td>${f(bil)}</td><td>${f(eur)} €</td></tr></table>`;
  $("r-total").textContent = bil.toLocaleString("pt-PT") + " bilhetes";
  $("r-valor").textContent = eur.toLocaleString("pt-PT") + " € em bilhetes";
  $("r-jogos").textContent = jg + (jg === 1 ? " jogo contado" : " jogos contados");
}

// escrever numa linha: atualiza só essa linha (não recria a lista, para o teclado não fechar)
$("lista").addEventListener("input", e => {
  const inp = e.target.closest("input"); if (!inp) return;
  const linha = inp.closest(".linha"), jogo = +linha.dataset.jogo;
  const l = estado.linhas[jogo] = estado.linhas[jogo] || {};
  estado.enviado = false;
  if (inp.dataset.m){            // número de um maço aberto
    const mc = inp.closest(".maco"), m = (l.macos || [])[+mc.dataset.i]; if (!m) return;
    m[inp.dataset.m] = p3(inp.value);
    if (inp.value !== m[inp.dataset.m]) inp.value = m[inp.dataset.m];
    return atualizarMaco(linha, jogo, mc, m);
  }
  l[inp.dataset.c] = inp.value.replace(/\D/g, "");
  if (inp.value !== l[inp.dataset.c]) inp.value = l[inp.dataset.c];
  atualizarLinha(linha, jogo);
});
function atualizarLinha(linha, jogo){
  const j = listaCompleta().find(x => x.jogo === jogo), l = estado.linhas[jogo] || {};
  const t = totalLinha(j), maco = macoDe(j), nm = (l.macos || []).length;
  linha.querySelector(".tot").innerHTML = `${t||""}<small>${maco ? "×"+maco : ""}</small>`;
  linha.classList.toggle("tem", temContagem(l));
  const mb = linha.querySelector(".mb"); mb.classList.toggle("tem-m", !!nm); mb.textContent = rotuloMb(l, maco);
  guardarEstado(); totais();
}
// escrever num maço aberto: atualiza só o resultado desse maço (sem recriar, para o teclado não fechar)
function atualizarMaco(linha, jogo, mc, m){
  const j = listaCompleta().find(x => x.jogo === jogo), l = estado.linhas[jogo], maco = macoDe(j), r = restoMaco(m, maco);
  mc.querySelector(".rest").textContent = r.n ? "= " + r.n + " bilhetes" : "";
  mc.querySelector(".erro").textContent = r.erro || ""; mc.querySelector(".av").textContent = r.aviso || "";
  const s = linha.querySelector(".soma"); if (s) s.textContent = "Maços abertos: " + restoMacos(l, maco) + " bilhetes";
  atualizarLinha(linha, jogo);
}
// botões da linha: abrir/fechar o painel do maço, acrescentar/remover maço, atalhos 000 / último
$("lista").addEventListener("click", e => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const linha = b.closest(".linha"), jogo = +linha.dataset.jogo, l = estado.linhas[jogo] = estado.linhas[jogo] || {};
  const mc = b.closest(".maco"), i = mc ? +mc.dataset.i : -1, a = b.dataset.a;
  estado.enviado = false;
  if (a === "tog"){
    if (abertos.has(jogo)) abertos.delete(jogo); else { abertos.add(jogo); if (!(l.macos || []).length) l.macos = [{a:"", b:""}]; }
    redesenharLinha(jogo);
    const f = $("lista").querySelector(`.linha[data-jogo="${jogo}"] .maco input`); if (f) f.focus();
  } else if (a === "add"){
    (l.macos = l.macos || []).push({a:"", b:""}); redesenharLinha(jogo);
    const todos = $("lista").querySelectorAll(`.linha[data-jogo="${jogo}"] .maco`); const u = todos[todos.length - 1]; if (u) u.querySelector("input").focus();
  } else if (a === "rm"){
    const m = l.macos[i]; if (m && (m.a || m.b) && !confirm("Remover este maço?")) return;
    l.macos.splice(i, 1); if (!l.macos.length) { delete l.macos; abertos.delete(jogo); }
    redesenharLinha(jogo);
  } else if (a === "fim"){
    const m = l.macos[i]; m.b = pad3(+b.dataset.v);
    mc.querySelector('input[data-m="b"]').value = m.b; atualizarMaco(linha, jogo, mc, m);
  }
});
$("lista").addEventListener("focusin", e => { if (e.target.matches("input")) { e.target.dataset.prev = e.target.value; setTimeout(() => e.target.select(), 0); } });

// valor invulgar: ao sair do campo, pede confirmação (apanha gralhas de teclado); se disser que não, volta ao valor anterior
$("lista").addEventListener("change", e => {
  const inp = e.target.closest("input"); if (!inp || !inp.dataset.c) return;
  const linha = inp.closest(".linha"), jogo = +linha.dataset.jogo, c = inp.dataset.c, v = num(inp.value);
  const j = listaCompleta().find(x => x.jogo === jogo); if (!j || !v) return;
  const maco = j.por_maco || POR_MACO[j.preco] || 0, msgs = [];
  if (c === "ind" && maco && v >= 2 * maco) msgs.push(`${v} soltos é muito (um maço tem ${maco}).`);
  if (c === "blo" && v > 30) msgs.push(`${v} blocos é muito.`);
  if (estado.tipo === "final"){
    const ini = ler(chave(estado.loja, estado.data, "inicial"), null), li = ini && ini.linhas[jogo];
    if (li){ const ti = num(li.ind) + restoMacos(li, maco) + num(li.blo) * maco, tf = totalLinha(j);
      if (tf > ti + 2 * maco) msgs.push(`O final (${tf}) é maior que o inicial (${ti}).`); }
  }
  if (!msgs.length || confirm(`${j.jogo} ${j.nome}\n${msgs.join("\n")}\nEstá certo?`)) return;
  const antes = num(inp.dataset.prev) || "";
  estado.linhas[jogo][c] = String(antes); inp.value = antes;
  atualizarLinha(linha, jogo);
});

// o tipo escolhe-se sozinho: já há final → final; inicial enviado → final; inicial por enviar → inicial;
// sem nada guardado, a partir das 15h é final. O botão «Inicial/Final» no topo troca à mão.
function tipoAuto(loja, data){
  const f = ler(chave(loja, data, "final"), null), i = ler(chave(loja, data, "inicial"), null);
  const tem = e => e && Object.values(e.linhas || {}).some(temContagem);
  if (tem(f)) return "final";
  if (tem(i)) return i.enviado ? "final" : "inicial";
  return data === hoje() && new Date().getHours() >= 15 ? "final" : "inicial";
}
function mudar(tipo){
  const loja = +$("loja").value, data = $("data").value || hoje();
  abrir(loja, data, tipo || tipoAuto(loja, data));
}
$("loja").addEventListener("change", () => mudar());
$("data").addEventListener("change", () => mudar());
$("tipo-lbl").addEventListener("click", () => mudar(estado.tipo === "final" ? "inicial" : "final"));
$("pesq").addEventListener("input", desenhar);
$("so-tem").addEventListener("click", e => { const b = e.currentTarget; b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); desenhar(); });

// «Copiar final de ontem»: a contagem inicial parte do último final guardado desta loja (data anterior)
$("b-copiar").addEventListener("click", () => {
  if (estado.tipo !== "inicial") return toast("Só na contagem inicial.");
  let melhor = null;
  for (let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i), m = /^rasp:(\d):(\d{4}-\d{2}-\d{2}):final$/.exec(k || "");
    if (m && +m[1] === estado.loja && m[2] < estado.data && (!melhor || m[2] > melhor)) melhor = m[2];
  }
  if (!melhor) return toast("Não há contagem final anterior guardada neste telemóvel.");
  if (Object.keys(estado.linhas).length && !confirm("Substituir o que já está preenchido?")) return;
  const f = ler(chave(estado.loja, melhor, "final"), null);
  estado.linhas = JSON.parse(JSON.stringify(f.linhas));
  guardarEstado(); desenhar(); toast("Copiado do final de " + melhor.split("-").reverse().join("-") + ".");
});

$("b-limpar").addEventListener("click", () => {
  if (!confirm("Apagar tudo o que está contado nesta contagem?")) return;
  estado.linhas = {}; guardarEstado(); desenhar();
});

// jogo novo (ex.: um jogo que chegou e ainda não está no site)
$("b-novo").addEventListener("click", () => { $("n-jogo").value = ""; $("n-nome").value = ""; $("d-novo").showModal(); });
$("n-cancel").addEventListener("click", () => $("d-novo").close());
$("n-ok").addEventListener("click", () => {
  const jogo = num($("n-jogo").value), nome = $("n-nome").value.trim(), preco = +$("n-preco").value;
  if (!jogo || !nome) return toast("Preenche o número e o nome.");
  if (listaCompleta().some(j => j.jogo === jogo)) { $("d-novo").close(); $("pesq").value = String(jogo); desenhar(); return toast("Esse jogo já existe: está filtrado na lista."); }
  const novo = {jogo, nome, preco, por_maco: POR_MACO[preco] || 0};
  estado.extras.push(novo);
  guardar("rasp:extras:" + estado.loja, [...ler("rasp:extras:" + estado.loja, []), novo]);
  guardarEstado(); $("d-novo").close(); $("pesq").value = String(jogo); desenhar();
});

// ficheiro enviado: um CSV por contagem, igual à folha do Excel (Jogo, Nome, Soltos, Blocos, Total)
function csv(){
  const L = ["Loja;Data;Tipo;Jogo;Nome;Preco;Indiv;Blocos;PorBloco;Total;Funcionaria;MacosAbertos"];
  for (const j of listaCompleta()){
    const l = estado.linhas[j.jogo] || {}, maco = macoDe(j), blo = num(l.blo), ind = num(l.ind) + restoMacos(l, maco);
    if (!ind && !blo) continue;
    // Indiv = soltos + o que resta nos maços abertos; MacosAbertos mostra os números escritos (agora>último=restam)
    const mac = (l.macos || []).filter(m => restoMaco(m, maco).n).map(m => `${m.a}>${m.b}=${restoMaco(m, maco).n}`).join("|");
    L.push([estado.loja, estado.data, estado.tipo, j.jogo, j.nome.replace(/;/g, ","), j.preco, ind, blo, maco, ind + blo * maco, estado.func || "", mac].join(";"));
  }
  return "﻿" + L.join("\r\n") + "\r\n";
}
// segundo ficheiro: só os totais por valor de bilhete (e o total geral)
function csvTotais(){
  const pp = {}; let bil = 0, eur = 0;
  for (const j of listaCompleta()){ const t = totalLinha(j); if (t){ pp[j.preco] = (pp[j.preco] || 0) + t; bil += t; eur += t * j.preco; } }
  const L = ["Loja;Data;Tipo;Funcionaria;Valor;Bilhetes;Euros"], base = [estado.loja, estado.data, estado.tipo, estado.func || ""];
  for (const p of Object.keys(pp).map(Number).sort((a,b) => a-b)) L.push([...base, p, pp[p], pp[p] * p].join(";"));
  L.push([...base, "TOTAL", bil, eur].join(";"));
  return "\ufeff" + L.join("\r\n") + "\r\n";
}
// manter o ecrã ligado durante a contagem (Wake Lock; volta a pedir ao regressar à app)
let ecraLock = null, ecraQuer = false;
async function pedirEcra(){
  try { ecraLock = await navigator.wakeLock.request("screen"); ecraLock.addEventListener("release", () => { ecraLock = null; }); }
  catch(e){ ecraQuer = false; $("ecra").setAttribute("aria-pressed", "false"); toast("Não foi possível manter o ecrã ligado."); }
}
{
  $("ecra").addEventListener("click", async () => {
    if (!("wakeLock" in navigator)) return toast("Este telemóvel ou endereço não permite. Funciona na versão publicada (https).");
    ecraQuer = !ecraQuer;
    $("ecra").setAttribute("aria-pressed", String(ecraQuer));
    if (ecraQuer){ await pedirEcra(); if (ecraQuer) toast("O ecrã fica ligado enquanto a app estiver aberta."); }
    else if (ecraLock){ ecraLock.release(); ecraLock = null; }
  });
  document.addEventListener("visibilitychange", () => { if (ecraQuer && !ecraLock && document.visibilityState === "visible") pedirEcra(); });
}
$("b-enviar").addEventListener("click", () => enviar());
async function enviar(){
  if (!Object.values(estado.linhas).some(temContagem)) return toast("Ainda não há nada contado.");
  const erros = listaCompleta().filter(j => ((estado.linhas[j.jogo] || {}).macos || []).some(m => restoMaco(m, macoDe(j)).erro));
  if (erros.length) return toast("Corrige o maço aberto fora do intervalo: " + erros.map(j => j.jogo).join(", ") + ".");
  if (!estado.func) return toast("Escolhe primeiro a funcionária.");
  const agora = new Date(), hora = String(agora.getHours()).padStart(2, "0") + "h" + String(agora.getMinutes()).padStart(2, "0");
  const sufixo = `${LOJAS[estado.loja]} ${estado.tipo} ${estado.data.split("-").reverse().join("-")} ${hora}.csv`;
  const ficheiros = [
    new File([csv()], "stocks " + sufixo, {type: "text/csv"}),
    new File([csvTotais()], "totais " + sufixo, {type: "text/csv"})
  ];
  try {
    if (navigator.canShare && navigator.canShare({files: ficheiros})){
      await navigator.share({files: ficheiros, title: "Contagem " + sufixo});
      estado.enviado = true; guardarEstado();
      return toast("Enviado (2 ficheiros).");
    }
  } catch(e){ if (e && e.name === "AbortError") return; }
  for (const f of ficheiros){ const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = f.name; a.click(); }
  estado.enviado = true; guardarEstado();
  toast("2 ficheiros guardados: stocks e totais.");
}

// contagens guardadas no telemóvel: rever, reabrir, reenviar, apagar
function contagensGuardadas(){
  const L = [];
  for (let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i), m = /^rasp:(\d):(\d{4}-\d{2}-\d{2}):(inicial|final)$/.exec(k || "");
    const e = m && ler(k, null);
    if (e) L.push({k, loja:+m[1], data:m[2], tipo:m[3], e});
  }
  return L.sort((a,b) => b.data.localeCompare(a.data) || a.loja - b.loja || a.tipo.localeCompare(b.tipo));
}
function resumoDe(e){
  let bil = 0, jg = 0;
  for (const [jogo, l] of Object.entries(e.linhas || {})){
    const j = [...jogos, ...(e.extras || [])].find(x => x.jogo === +jogo), maco = j ? (j.por_maco || POR_MACO[j.preco] || 0) : 0;
    const t = num(l.ind) + restoMacos(l, maco) + num(l.blo) * maco; if (t){ bil += t; jg++; }
  }
  return {bil, jg};
}
const dmy = d => d.split("-").reverse().join("-");
function desenharGuardadas(){
  const L = contagensGuardadas();
  $("g-lista").innerHTML = L.length ? L.map(c => { const r = resumoDe(c.e);
    return `<div class="g-item"><b>${dmy(c.data)} · ${LOJAS[c.loja]} · ${c.tipo === "final" ? "Final" : "Inicial"}</b>` +
      `<small>${esc(c.e.func || "sem funcionária")} · ${r.jg} jogos · ${r.bil.toLocaleString("pt-PT")} bilhetes · ${c.e.enviado ? "enviada" : "por enviar"}</small>` +
      `<div class="bt"><button class="btn" data-a="abrir" data-k="${esc(c.k)}">Abrir</button><button class="btn" data-a="enviar" data-k="${esc(c.k)}">Reenviar</button><button class="btn perigo" data-a="apagar" data-k="${esc(c.k)}">Apagar</button></div></div>`;
  }).join("") : '<div class="vazio">Ainda não há contagens guardadas.</div>';
  const b = ler("rasp:backup", 0), dias = b ? Math.floor((Date.now() - b) / 864e5) : null;
  $("g-copia").textContent = b ? `Última cópia de segurança: ${dias === 0 ? "hoje" : "há " + dias + (dias === 1 ? " dia" : " dias")}.` : "Ainda não fez nenhuma cópia de segurança.";
}
$("b-guardadas").addEventListener("click", () => { desenharGuardadas(); $("d-guard").showModal(); });
$("g-fechar").addEventListener("click", () => $("d-guard").close());
$("g-lista").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const m = /^rasp:(\d):(\d{4}-\d{2}-\d{2}):(inicial|final)$/.exec(b.dataset.k || ""); if (!m) return;
  if (b.dataset.a === "apagar"){
    if (!confirm("Apagar esta contagem do telemóvel? Não dá para desfazer.")) return;
    try { localStorage.removeItem(b.dataset.k); } catch(err){}
    if (estado.loja === +m[1] && estado.data === m[2] && estado.tipo === m[3]) abrir(+m[1], m[2], m[3]);
    return desenharGuardadas();
  }
  $("d-guard").close(); abrir(+m[1], m[2], m[3]);
  if (b.dataset.a === "enviar") enviar(); else toast("Aberta a contagem de " + dmy(m[2]) + ".");
});

// cópia de segurança: um ficheiro .json com tudo o que está guardado (contagens, nomes, jogos acrescentados)
const chavesApp = () => { const r = []; for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && k.startsWith("rasp:") && k !== "rasp:jogos" && k !== "rasp:backup") r.push(k); } return r; };
$("g-backup").addEventListener("click", async () => {
  const dados = {}; chavesApp().forEach(k => dados[k] = ler(k, null));
  const f = new File([JSON.stringify({app:"raspadinhas", versao:1, criado:new Date().toISOString(), dados})], `copia raspadinhas ${dmy(hoje())}.json`, {type:"application/json"});
  try {
    if (navigator.canShare && navigator.canShare({files:[f]})) await navigator.share({files:[f], title:f.name});
    else { const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = f.name; a.click(); }
  } catch(err){ if (err && err.name === "AbortError") return; }
  guardar("rasp:backup", Date.now()); desenharGuardadas(); toast("Cópia de segurança feita.");
});
$("g-restaurar").addEventListener("click", () => $("g-ficheiro").click());
$("g-ficheiro").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  let c; try { c = JSON.parse(await f.text()); } catch(err){}
  if (!c || c.app !== "raspadinhas" || !c.dados) return toast("Esse ficheiro não é uma cópia desta app.");
  const ks = Object.keys(c.dados).filter(k => k.startsWith("rasp:") && k !== "rasp:jogos" && k !== "rasp:backup");
  if (!ks.length || !confirm(`Restaurar ${ks.length} itens da cópia de ${c.criado ? dmy(c.criado.slice(0,10)) : "?"}? Contagens com a mesma loja, data e tipo são substituídas.`)) return;
  for (const k of ks){
    if (k === "rasp:funcs") guardar(k, [...new Set([...ler(k, []), ...(c.dados[k] || [])])]);
    else guardar(k, c.dados[k]);
  }
  location.reload();
});

(async function(){
  await carregarJogos();
  const u = ler("rasp:ultimo", {loja:3, tipo:"inicial"});
  let data = hoje(), retomada = false;
  // retoma: se a última contagem aberta era de outro dia e ficou por enviar, volta a ela
  if (u.data && u.data !== data){
    const e = ler(chave(u.loja, u.data, u.tipo), null);
    if (e && !e.enviado && Object.values(e.linhas || {}).some(temContagem)){ data = u.data; retomada = true; }
  }
  abrir(u.loja || 3, data, retomada ? u.tipo : tipoAuto(u.loja || 3, data));
  if (retomada) toast("Retomada a contagem de " + dmy(data) + " (ainda não enviada).");
  const b = ler("rasp:backup", 0);
  if (contagensGuardadas().length && (!b || Date.now() - b > 7 * 864e5)) $("aviso-lista").textContent += " · Falta cópia de segurança (botão no fim da página).";
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(err){}
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
