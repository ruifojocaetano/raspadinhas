name: Atualizar lista de jogos

on:
  schedule:
    - cron: "30 5 * * *"   # todos os dias às 05:30 UTC (06:30 no verão, 05:30 no inverno em Lisboa)
  workflow_dispatch:       # também se pode correr à mão, no separador Actions

permissions:
  contents: write

concurrency:
  group: atualizar-jogos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Lisbon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4 openpyxl

      - name: Varrer o site da Santa Casa
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/automacao/atualizar_raspadinhas.py"

      - name: Gerar jogos.json
        run: python automacao/gerar_lista.py --site "$RUNNER_TEMP/Raspadinhas.xlsx" --extra automacao/jogos_extra.csv --saida jogos.json --minimo 20

      - name: Guardar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jogos.json
          git commit -m "Lista de jogos atualizada" || echo "Sem alterações"
          git push
